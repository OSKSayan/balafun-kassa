<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#180d38">
<title>balaFUN Касса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg-top:#180d38;
  --bg-bottom:#3a1257;
  --surface:#241454;
  --surface-2:#2d1a64;
  --surface-3:#392176;
  --border:rgba(255,255,255,.13);
  --border-strong:rgba(255,255,255,.22);
  --text:#f5efff;
  --text-dim:#b7a9de;
  --text-faint:#8779ae;
  --accent:#ffc94d;
  --accent-ink:#3a2400;
  --accent2:#3ee6ff;
  --accent2-ink:#00323b;
  --danger:#ff5d78;
  --danger-ink:#3a0010;
  --danger-bg:#432047;
  --success:#57e6a1;
  --success-ink:#00311c;
  --shadow: 0 14px 34px rgba(6,2,20,.5);
  --shadow-sm: 0 4px 14px rgba(6,2,20,.35);
  --r-lg:22px;
  --r-md:16px;
  --r-sm:11px;
  font-family:'Inter',system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1.2px 1.2px at 10% 15%, rgba(255,255,255,.55) 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 80% 8%, rgba(255,255,255,.5) 50%, transparent 51%),
    radial-gradient(1px 1px at 60% 30%, rgba(255,255,255,.45) 50%, transparent 51%),
    radial-gradient(1.2px 1.2px at 30% 60%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1.6px 1.6px at 90% 70%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1px 1px at 45% 85%, rgba(255,255,255,.4) 50%, transparent 51%),
    radial-gradient(1.3px 1.3px at 15% 90%, rgba(255,255,255,.35) 50%, transparent 51%),
    linear-gradient(180deg,var(--bg-top),var(--bg-bottom) 70%);
  background-attachment:fixed;
  color:var(--text);
  font-size:15px;
  line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
h1,h2,h3,.display{font-family:'Baloo 2',ui-rounded,'Segoe UI',sans-serif;}
.num{font-variant-numeric:tabular-nums;}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent2); outline-offset:2px; border-radius:6px;}
img{max-width:100%;}
::-webkit-scrollbar{width:0;height:0;}

/* ---------- layout shell ---------- */
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;}
#mainApp{min-height:100vh;}
.screen{padding:18px 16px 24px;}
#screen-orders,#screen-history,#screen-stats,#screen-menu{padding-bottom:100px;}
.screen-header{
  display:flex;align-items:center;gap:10px;justify-content:space-between;
  margin-bottom:16px;min-height:40px;
}
.screen-header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px;}
.screen-header .sub{color:var(--text-dim);font-size:12.5px;margin-top:2px;}
.hstack{display:flex;align-items:center;gap:8px;}

/* ---------- bottom nav ---------- */
#bottomNav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  max-width:560px;margin:0 auto;
  display:flex;justify-content:space-around;
  background:rgba(24,13,56,.92);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--border);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
#bottomNav button{
  background:none;border:none;color:var(--text-faint);
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;padding:4px 10px;border-radius:12px;
  cursor:pointer;
}
#bottomNav button .ic{font-size:19px;line-height:1;}
#bottomNav button.active{color:var(--accent);}
#bottomNav button.active .ic{transform:translateY(-1px);}

/* ---------- buttons ---------- */
.btn{
  border:none;border-radius:14px;padding:12px 18px;font-weight:700;font-size:14.5px;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease;
}
.btn:active{transform:scale(.96);}
.btn-primary{background:linear-gradient(180deg,#ffd876,var(--accent));color:var(--accent-ink);box-shadow:var(--shadow-sm);}
.btn-accent2{background:linear-gradient(180deg,#7ff1ff,var(--accent2));color:var(--accent2-ink);box-shadow:var(--shadow-sm);}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(255,93,120,.35);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:11px;}
.icon-btn{
  width:38px;height:38px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text);font-size:17px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.icon-btn:active{transform:scale(.94);}
.icon-btn.danger{color:var(--danger);}
.fab{
  position:fixed;right:calc(50% - 280px + 18px);bottom:96px;z-index:35;
  border-radius:999px;padding:14px 20px;font-size:14.5px;
}
@media (max-width:560px){.fab{right:18px;}}

/* ---------- empty state ---------- */
.empty{
  text-align:center;padding:52px 20px;color:var(--text-dim);
}
.empty .big{font-size:44px;display:block;margin-bottom:10px;}
.empty .t{font-family:'Baloo 2';font-size:17px;color:var(--text);font-weight:700;margin-bottom:4px;}

/* ---------- order cards ---------- */
.order-list{display:flex;flex-direction:column;gap:10px;}
.order-card{
  background:linear-gradient(160deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);border-radius:var(--r-lg);
  padding:14px 16px;cursor:pointer;box-shadow:var(--shadow-sm);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}
.order-card:active{transform:scale(.985);}
.order-card .label{font-family:'Baloo 2';font-weight:700;font-size:16px;}
.order-card .meta{color:var(--text-dim);font-size:12px;margin-top:3px;}
.order-card .total{font-family:'Baloo 2';font-weight:800;font-size:17px;color:var(--accent);white-space:nowrap;}

/* ---------- order detail ---------- */
.line-row{
  display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);
}
.line-row:last-child{border-bottom:none;}
.line-thumb{width:42px;height:42px;border-radius:11px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden;}
.line-thumb img{width:100%;height:100%;object-fit:cover;}
.line-info{flex:1;min-width:0;}
.line-name{font-weight:600;font-size:14px;}
.line-price{color:var(--text-dim);font-size:12px;margin-top:1px;}
.qty-stepper{display:flex;align-items:center;gap:8px;}
.qty-stepper button{
  width:28px;height:28px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface-3);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.qty-stepper button:active{transform:scale(.9);}
.qty-val{min-width:18px;text-align:center;font-weight:700;font-size:14px;}
.line-total{width:66px;text-align:right;font-weight:700;font-size:13.5px;}
.line-remove{color:var(--danger);background:none;border:none;font-size:17px;cursor:pointer;padding:4px 2px 4px 6px;}

.summary-bar{
  position:sticky;bottom:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);padding:14px 16px;margin-top:14px;box-shadow:var(--shadow);
}
.summary-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.summary-row .lbl{color:var(--text-dim);font-size:13px;}
.summary-row .val{font-family:'Baloo 2';font-size:22px;font-weight:800;color:var(--accent);}
.summary-actions{display:flex;gap:10px;}

/* ---------- group tabs ---------- */
.group-tabs{display:flex;gap:6px;margin-bottom:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:4px;}
.grouptab{flex:1;border:none;background:none;color:var(--text-dim);font-weight:700;font-size:13.5px;padding:10px 8px;border-radius:11px;cursor:pointer;}
.grouptab.active{background:linear-gradient(180deg,#ffd876,var(--accent));color:var(--accent-ink);}

/* ---------- category chips ---------- */
.chip-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px;}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--text-dim);font-weight:600;font-size:13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.chip.active{background:linear-gradient(180deg,#ffd876,var(--accent));color:var(--accent-ink);border-color:transparent;}

/* ---------- item grid ---------- */
.item-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.item-card{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;
}
.item-card:active{transform:scale(.97);}
.item-card .thumb{
  width:100%;aspect-ratio:1.4;border-radius:10px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden;
}
.item-card .thumb img{width:100%;height:100%;object-fit:cover;}
.item-card .nm{font-size:13px;font-weight:600;line-height:1.25;}
.item-card .pr{font-weight:700;color:var(--accent);font-size:13px;}

/* ---------- overlay (picker) ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:var(--bg-bottom);
  max-width:560px;margin:0 auto;display:flex;flex-direction:column;
}
.overlay-header{
  display:flex;align-items:center;gap:10px;padding:16px 16px 8px;
  background:linear-gradient(180deg,var(--bg-top),transparent);
}
.overlay-body{flex:1;overflow-y:auto;padding:0 16px 16px;}
.overlay-footer{
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--surface);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.overlay-footer .tot{font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--accent);}

/* ---------- history ---------- */
.date-group{margin-bottom:18px;}
.date-group h3{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px;font-weight:700;}
.hist-row{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);
  padding:12px 14px;margin-bottom:8px;
}
.hist-row .top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:10px;}
.hist-row .label{font-weight:700;font-size:14.5px;}
.hist-row .time{color:var(--text-dim);font-size:12px;}
.hist-row .total{font-weight:800;color:var(--accent);font-family:'Baloo 2';font-size:15px;}
.hist-items{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);display:none;}
.hist-items.open{display:block;}
.hist-items .li{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);padding:3px 0;}
.hist-actions{display:flex;justify-content:flex-end;margin-top:8px;}

/* ---------- stats ---------- */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;}
.stat-card.wide{grid-column:1/-1;background:linear-gradient(135deg,var(--surface-3),var(--surface-2));}
.stat-card .lbl{color:var(--text-dim);font-size:12px;margin-bottom:6px;}
.stat-card .v{font-family:'Baloo 2';font-size:23px;font-weight:800;color:var(--success);}
.stat-card.wide .v{color:var(--accent);font-size:30px;}
.bars{display:flex;align-items:flex-end;gap:10px;height:130px;padding:10px 4px 0;}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;}
.bar-col .b{width:100%;max-width:30px;background:linear-gradient(180deg,var(--accent2),#1c9fb3);border-radius:8px 8px 3px 3px;min-height:4px;}
.bar-col .amt{font-size:10px;color:var(--text-dim);}
.bar-col .day{font-size:11px;color:var(--text-dim);font-weight:600;}

/* ---------- menu screen ---------- */
.cat-block{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:10px;overflow:hidden;}
.cat-block-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;}
.cat-block-head .em{font-size:20px;}
.cat-block-head .nm{flex:1;font-weight:700;font-family:'Baloo 2';font-size:15px;}
.cat-block-head .cnt{color:var(--text-dim);font-size:12px;}
.cat-block-body{padding:0 14px 12px;display:none;}
.cat-block-body.open{display:block;}
.menu-item-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--border);}
.menu-item-row .thumb{width:36px;height:36px;border-radius:9px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:17px;overflow:hidden;flex-shrink:0;}
.menu-item-row .thumb img{width:100%;height:100%;object-fit:cover;}
.menu-item-row .nm{flex:1;font-size:13.5px;font-weight:600;}
.menu-item-row .pr{font-size:13px;color:var(--text-dim);}
.cat-actions{display:flex;gap:6px;padding:10px 0 2px;}

/* ---------- modal ---------- */
#modalRoot:not([hidden]){position:fixed;inset:0;z-index:80;}
.modal-backdrop{
  position:absolute;inset:0;background:rgba(8,4,20,.6);backdrop-filter:blur(2px);
  display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .18s ease;
}
.modal-backdrop.show{opacity:1;}
.modal-card{
  width:100%;max-width:560px;background:var(--surface);border:1px solid var(--border);
  border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(16px);transition:transform .18s ease;max-height:88vh;overflow-y:auto;
}
.modal-backdrop.show .modal-card{transform:translateY(0);}
@media (min-width:600px){
  .modal-backdrop{align-items:center;}
  .modal-card{border-radius:22px;}
}
.modal-card h2{margin:0 0 14px;font-size:18px;}
.modal-card p.msg{color:var(--text-dim);font-size:14px;margin:-8px 0 16px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-weight:600;}
.field input[type=text],.field input[type=number],.field select{
  width:100%;background:var(--surface-2);border:1px solid var(--border-strong);
  border-radius:12px;padding:11px 12px;color:var(--text);font-size:14.5px;font-family:inherit;
}
.field input:focus,.field select:focus{border-color:var(--accent2);}
.photo-row{display:flex;gap:10px;align-items:center;}
.photo-preview{width:64px;height:64px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden;flex-shrink:0;}
.photo-preview img{width:100%;height:100%;object-fit:cover;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-actions .btn{flex:1;}

/* ---------- lock screen ---------- */
#lockScreen,#setupScreen{
  min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;gap:6px;
}
#lockScreen .ufo,#setupScreen .ufo{font-size:52px;margin-bottom:6px;}
#lockScreen h1,#setupScreen h1{font-size:24px;margin:0;font-weight:800;}
#lockScreen .who,#setupScreen .who{color:var(--text-dim);font-size:13.5px;margin-bottom:22px;}
.setup-form{width:100%;max-width:320px;text-align:left;display:flex;flex-direction:column;gap:2px;}
.setup-form .btn{margin-top:8px;}
.setup-note{color:var(--text-faint);font-size:12px;margin-top:16px;max-width:280px;}
.pin-dots{display:flex;gap:14px;margin-bottom:26px;}
.pin-dots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border-strong);background:transparent;}
.pin-dots span.filled{background:var(--accent);border-color:var(--accent);}
.pin-dots.shake{animation:shake .32s;}
@media (prefers-reduced-motion:reduce){.pin-dots.shake{animation:none;}}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-9px);}
  40%{transform:translateX(8px);}
  60%{transform:translateX(-6px);}
  80%{transform:translateX(4px);}
}
.numpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;}
.numpad button{
  width:72px;height:72px;border-radius:50%;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text);font-size:23px;font-weight:700;cursor:pointer;
}
.numpad button:active{background:var(--surface-3);transform:scale(.95);}
.numpad button.ghost{background:none;border:none;color:var(--text-dim);font-size:19px;}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(10px);
  background:var(--surface-3);border:1px solid var(--border-strong);color:var(--text);
  padding:11px 18px;border-radius:14px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;transition:opacity .2s ease, transform .2s ease;
  z-index:90;max-width:90%;text-align:center;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div id="app">
  <div id="lockScreen">
    <div class="ufo">🛸</div>
    <h1>balaFUN Касса</h1>
    <div class="who" id="lockWho">Официант</div>
    <div class="pin-dots" id="pinDots">
      <span></span><span></span><span></span><span></span>
    </div>
    <div class="numpad" id="numpad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button class="ghost" data-k="clear">Стереть</button><button data-k="0">0</button><button class="ghost" data-k="back">⌫</button>
    </div>
  </div>

  <div id="setupScreen" hidden>
    <div class="ufo">🛸</div>
    <h1>balaFUN Касса</h1>
    <div class="who">Это твой первый вход — давай знакомиться</div>
    <div class="setup-form">
      <div class="field"><label>Твоё имя</label><input type="text" id="setupName" placeholder="Например: Данияр"></div>
      <div class="field"><label>Придумай PIN (4 цифры)</label><input type="text" inputmode="numeric" maxlength="4" id="setupPin" placeholder="••••"></div>
      <div class="field"><label>Повтори PIN</label><input type="text" inputmode="numeric" maxlength="4" id="setupPin2" placeholder="••••"></div>
      <button class="btn btn-primary btn-block" id="btnSetupStart">Начать работу</button>
    </div>
    <div class="setup-note">Все твои заказы и настройки останутся только на этом телефоне.</div>
  </div>

  <div id="mainApp" hidden>
    <main id="content">

      <section class="screen" id="screen-orders">
        <div class="screen-header">
          <div>
            <h1>Заказы</h1>
            <div class="sub" id="ordersSub"></div>
          </div>
        </div>
        <div class="order-list" id="ordersList"></div>
        <button class="btn btn-primary fab" id="btnNewOrder">✛ Новый заказ</button>
      </section>

      <section class="screen" id="screen-order-detail" hidden>
        <div class="screen-header">
          <div class="hstack">
            <button class="icon-btn" id="btnBackFromOrder">←</button>
            <div>
              <h1 id="odLabel" style="cursor:pointer;">Заказ</h1>
              <div class="sub" id="odMeta"></div>
            </div>
          </div>
          <button class="icon-btn danger" id="btnDeleteOrder">🗑</button>
        </div>
        <div id="odLines"></div>
        <div class="summary-bar">
          <div class="summary-row">
            <span class="lbl">Итого</span>
            <span class="val num" id="odTotal">0 ₸</span>
          </div>
          <div class="summary-actions">
            <button class="btn btn-ghost" id="btnAddDishes" style="flex:1;">🍽 Добавить блюда</button>
            <button class="btn btn-primary" id="btnCloseOrder" style="flex:1;">✓ Пробить чек</button>
          </div>
        </div>
      </section>

      <section class="screen" id="screen-history" hidden>
        <div class="screen-header"><h1>История</h1></div>
        <div id="historyList"></div>
      </section>

      <section class="screen" id="screen-stats" hidden>
        <div class="screen-header"><h1>Касса</h1></div>
        <div id="statsBody"></div>
      </section>

const GROUP_MAP = {
  'Айс-латте':'bar','Лимонады':'bar','Молочные коктейли':'bar','Кофе':'bar','Чай':'bar','Прохладительные напитки':'bar',
  'Шашлыки':'kitchen','Сеты':'kitchen','Горячие блюда':'kitchen','Суши и роллы':'kitchen','Банкетное меню':'kitchen',
  'Дополнительно':'kitchen','Пицца':'kitchen','Детское меню':'kitchen','Салаты':'kitchen','Гарниры':'kitchen','Супы':'kitchen'
};

/* ================= STATE ================= */
let state = {
  categories: [],
  items: [],
  orders: [],
  meta: { key:'settings', pin:'', ownerName:'', orderCounter:0, setupDone:false },
  currentOrderId: null,
  pickerGroup: 'bar',
  pickerCategoryId: null,
  menuOpenCategoryId: null,
  pinBuffer: ''
};

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)); }
function money(n){ return Math.round(n).toLocaleString('ru-RU') + ' ₸'; }

/* ================= IndexedDB ================= */
const DB_NAME = 'kassa_balafun', DB_VERSION = 1;
let dbPromise = null;
function idbOpen(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('categories')) db.createObjectStore('categories',{keyPath:'id'});
      if(!db.objectStoreNames.contains('items')) db.createObjectStore('items',{keyPath:'id'});
      if(!db.objectStoreNames.contains('orders')) db.createObjectStore('orders',{keyPath:'id'});
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
    };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return dbPromise;
}
async function idbGetAll(store){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbPut(store,val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(val);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbDelete(store,key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}

/* ================= INIT / SEED ================= */
async function init(){
  const [cats, items, orders, metaRows] = await Promise.all([
    idbGetAll('categories'), idbGetAll('items'), idbGetAll('orders'), idbGetAll('meta')
  ]);
  state.categories = cats; state.items = items; state.orders = orders;
  const metaRow = metaRows.find(m=>m.key==='settings');
  if(metaRow){
    if(metaRow.setupDone === undefined) metaRow.setupDone = true;
    state.meta = metaRow;
  }

  if(state.categories.length===0){
    for(const [catName, emoji, dishes] of SEED){
      const cat = { id: uid(), name: catName, emoji, group: GROUP_MAP[catName] || 'kitchen' };
      state.categories.push(cat);
      await idbPut('categories', cat);
      for(const [dishName, price] of dishes){
        const item = { id: uid(), categoryId: cat.id, name: dishName, price, photo: null };
        state.items.push(item);
        await idbPut('items', item);
      }
    }
    await idbPut('meta', state.meta);
  } else {
    for(const cat of state.categories){
      if(!cat.group){ cat.group = GROUP_MAP[cat.name] || 'kitchen'; await idbPut('categories', cat); }
    }
  }

  bindEvents();
  bindSetupEvents();
  if(!state.meta.setupDone){
    document.getElementById('lockScreen').hidden = true;
    document.getElementById('setupScreen').hidden = false;
  } else {
    document.getElementById('lockWho').textContent = 'Официант: ' + state.meta.ownerName;
    renderPinDots();
  }
}

/* ================= FIRST-RUN SETUP ================= */
function bindSetupEvents(){
  document.getElementById('btnSetupStart').onclick = async ()=>{
    const name = document.getElementById('setupName').value.trim();
    const pin = document.getElementById('setupPin').value.trim();
    const pin2 = document.getElementById('setupPin2').value.trim();
    if(!name){ showToast('Введи своё имя'); return; }
    if(!/^\d{4}$/.test(pin)){ showToast('PIN должен быть из 4 цифр'); return; }
    if(pin !== pin2){ showToast('PIN не совпадает'); return; }
    state.meta.ownerName = name;
    state.meta.pin = pin;
    state.meta.setupDone = true;
    await idbPut('meta', state.meta);
    document.getElementById('setupScreen').hidden = true;
    document.getElementById('lockWho').textContent = 'Официант: ' + state.meta.ownerName;
    unlock();
  };
}

/* ================= LOCK SCREEN ================= */
function renderPinDots(){
  const dots = document.querySelectorAll('#pinDots span');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < state.pinBuffer.length));
}
function handlePinKey(k){
  if(k==='clear'){ state.pinBuffer=''; renderPinDots(); return; }
  if(k==='back'){ state.pinBuffer = state.pinBuffer.slice(0,-1); renderPinDots(); return; }
  if(state.pinBuffer.length>=4) return;
  state.pinBuffer += k;
  renderPinDots();
  if(state.pinBuffer.length===4){
    if(state.pinBuffer === state.meta.pin){
      setTimeout(unlock, 120);
    } else {
      const dotsWrap = document.getElementById('pinDots');
      dotsWrap.classList.add('shake');
      showToast('Неверный PIN');
      setTimeout(()=>{ dotsWrap.classList.remove('shake'); state.pinBuffer=''; renderPinDots(); }, 320);
    }
  }
}
function unlock(){
  document.getElementById('lockScreen').hidden = true;
  document.getElementById('mainApp').hidden = false;
  state.pinBuffer='';
  showScreen('orders');
}

/* ================= NAVIGATION ================= */
function showSection(id){
  document.querySelectorAll('.screen').forEach(s=> s.hidden = (s.id !== id));
  document.getElementById('bottomNav').hidden = (id==='screen-order-detail');
}
function showScreen(name){
  showSection('screen-'+name);
  document.querySelectorAll('#bottomNav button').forEach(b=> b.classList.toggle('active', b.dataset.screen===name));
  if(name==='orders') renderOrders();
  if(name==='history') renderHistory();
  if(name==='stats') renderStats();
  if(name==='menu') renderMenu();
}

/* ================= TOAST ================= */
let toastTimer=null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2000);
}

/* ================= MODAL ================= */
function openModal(html){
  const root = document.getElementById('modalRoot');
  root.hidden = false;
  root.innerHTML = '<div class="modal-backdrop"><div class="modal-card">'+html+'</div></div>';
  const backdrop = root.querySelector('.modal-backdrop');
  requestAnimationFrame(()=> backdrop.classList.add('show'));
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
  return root.querySelector('.modal-card');
}
function closeModal(){
  const root = document.getElementById('modalRoot');
  root.hidden = true; root.innerHTML='';
}
function askConfirm(title, message, opts){
  opts = opts || {};
  return new Promise(resolve=>{
    const card = openModal(
      '<h2>'+title+'</h2>' +
      '<p class="msg">'+message+'</p>' +
      '<div class="modal-actions">' +
        '<button class="btn btn-ghost" id="mCancel">Отмена</button>' +
        '<button class="btn '+(opts.danger?'btn-danger':'btn-primary')+'" id="mOk">'+(opts.okLabel||'ОК')+'</button>' +
      '</div>'
    );
    card.querySelector('#mCancel').onclick = ()=>{ closeModal(); resolve(false); };
    card.querySelector('#mOk').onclick = ()=>{ closeModal(); resolve(true); };
  });
}

/* ================= ORDERS SCREEN ================= */
function renderOrders(){
  const open = state.orders.filter(o=>o.status==='open').sort((a,b)=>b.createdAt-a.createdAt);
  const list = document.getElementById('ordersList');
  document.getElementById('ordersSub').textContent = open.length ? open.length+' активных' : '';
  if(open.length===0){
    list.innerHTML = '<div class="empty"><span class="big">🛸</span><div class="t">Пока нет активных заказов</div>Нажми «Новый заказ», чтобы начать</div>';
    return;
  }
  list.innerHTML = open.map(o=>{
    const total = orderTotal(o);
    const count = o.lines.reduce((s,l)=>s+l.qty,0);
    return '<div class="order-card" data-id="'+o.id+'">' +
      '<div><div class="label">'+esc(o.label)+'</div><div class="meta">'+count+' поз. · '+timeStr(o.createdAt)+'</div></div>' +
      '<div class="total num">'+money(total)+'</div>' +
    '</div>';
  }).join('');
  list.querySelectorAll('.order-card').forEach(el=>{
    el.onclick = ()=> openOrderDetail(el.dataset.id);
  });
}
function orderTotal(o){ return o.lines.reduce((s,l)=> s + l.price*l.qty, 0); }
function timeStr(ts){ return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }

async function createNewOrder(){
  const card = openModal(
    '<h2>Новый заказ</h2>' +
    '<div class="field"><label>Стол / гость (необязательно)</label>' +
    '<input type="text" id="newOrderLabel" placeholder="Например: Стол 5"></div>' +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" id="mCancel">Отмена</button>' +
      '<button class="btn btn-primary" id="mOk">Создать</button>' +
    '</div>'
  );
  card.querySelector('#mCancel').onclick = closeModal;
  card.querySelector('#mOk').onclick = async ()=>{
    const val = card.querySelector('#newOrderLabel').value.trim();
    state.meta.orderCounter = (state.meta.orderCounter||0) + 1;
    await idbPut('meta', state.meta);
    const order = {
      id: uid(),
      label: val || ('Заказ №'+state.meta.orderCounter),
      status: 'open',
      createdAt: Date.now(),
      closedAt: null,
      lines: []
    };
    state.orders.push(order);
    await idbPut('orders', order);
    closeModal();
    openOrderDetail(order.id);
  };
}

/* ================= ORDER DETAIL ================= */
function openOrderDetail(id){
  state.currentOrderId = id;
  showSection('screen-order-detail');
  renderOrderDetail();
}
function getCurrentOrder(){ return state.orders.find(o=>o.id===state.currentOrderId); }

function renderOrderDetail(){
  const o = getCurrentOrder();
  if(!o) return;
  document.getElementById('odLabel').textContent = o.label;
  document.getElementById('odMeta').textContent = timeStr(o.createdAt) + (o.lines.length? ' · '+o.lines.reduce((s,l)=>s+l.qty,0)+' поз.' : '');
  const wrap = document.getElementById('odLines');
  if(o.lines.length===0){
    wrap.innerHTML = '<div class="empty"><span class="big">🍽️</span><div class="t">Заказ пуст</div>Добавь блюда из меню</div>';
  } else {
    wrap.innerHTML = o.lines.map(l=>{
      const item = state.items.find(i=>i.id===l.itemId);
      const thumb = item && item.photo ? '<img src="'+item.photo+'">' : (item ? categoryEmoji(item.categoryId) : '🍽️');
      return '<div class="line-row" data-id="'+l.itemId+'">' +
        '<div class="line-thumb">'+thumb+'</div>' +
        '<div class="line-info"><div class="line-name">'+esc(l.name)+'</div><div class="line-price num">'+money(l.price)+'</div></div>' +
        '<div class="qty-stepper">' +
          '<button data-act="dec">−</button><span class="qty-val num">'+l.qty+'</span><button data-act="inc">+</button>' +
        '</div>' +
        '<div class="line-total num">'+money(l.price*l.qty)+'</div>' +
        '<button class="line-remove" data-act="remove">✕</button>' +
      '</div>';
    }).join('');
  }
  document.getElementById('odTotal').textContent = money(orderTotal(o));
  document.getElementById('btnCloseOrder').disabled = o.lines.length===0;
  document.getElementById('btnCloseOrder').style.opacity = o.lines.length===0 ? .5 : 1;

  wrap.querySelectorAll('.line-row').forEach(row=>{
    const itemId = row.dataset.id;
    row.querySelector('[data-act="inc"]').onclick = ()=> changeLineQty(itemId, 1);
    row.querySelector('[data-act="dec"]').onclick = ()=> changeLineQty(itemId, -1);
    row.querySelector('[data-act="remove"]').onclick = ()=> removeLine(itemId);
  });
}
function categoryEmoji(catId){ const c = state.categories.find(c=>c.id===catId); return c ? c.emoji : '🍽️'; }

async function changeLineQty(itemId, delta){
  const o = getCurrentOrder();
  const line = o.lines.find(l=>l.itemId===itemId);
  if(!line) return;
  line.qty += delta;
  if(line.qty<=0) o.lines = o.lines.filter(l=>l.itemId!==itemId);
  await idbPut('orders', o);
  renderOrderDetail();
  if(!document.getElementById('pickerOverlay').hidden) renderPickerTotal();
}
async function removeLine(itemId){
  const o = getCurrentOrder();
  o.lines = o.lines.filter(l=>l.itemId!==itemId);
  await idbPut('orders', o);
  renderOrderDetail();
  if(!document.getElementById('pickerOverlay').hidden) renderPickerTotal();
}
async function addLine(item){
  const o = getCurrentOrder();
  const existing = o.lines.find(l=>l.itemId===item.id);
  if(existing) existing.qty += 1;
  else o.lines.push({ itemId:item.id, name:item.name, price:item.price, qty:1 });
  await idbPut('orders', o);
  renderOrderDetail();
  renderPickerTotal();
  showToast('+ '+item.name);
}

async function renameOrder(){
  const o = getCurrentOrder();
  const card = openModal(
    '<h2>Название заказа</h2>' +
    '<div class="field"><input type="text" id="renameInput" value="'+esc(o.label)+'"></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" id="mCancel">Отмена</button><button class="btn btn-primary" id="mOk">Сохранить</button></div>'
  );
  card.querySelector('#mCancel').onclick = closeModal;
  card.querySelector('#mOk').onclick = async ()=>{
    const val = card.querySelector('#renameInput').value.trim();
    if(val){ o.label = val; await idbPut('orders', o); renderOrderDetail(); renderOrders(); }
    closeModal();
  };
}

async function closeCurrentOrder(){
  const o = getCurrentOrder();
  if(o.lines.length===0) return;
  const ok = await askConfirm('Закрыть заказ?', 'Пробить чек на сумму '+money(orderTotal(o))+'?');
  if(!ok) return;
  o.status = 'closed';
  o.closedAt = Date.now();
  await idbPut('orders', o);
  showToast('Заказ закрыт: '+money(orderTotal(o)));
  showScreen('orders');
}
async function deleteCurrentOrder(){
  const o = getCurrentOrder();
  const isOpen = o.status==='open';
  const ok = await askConfirm(
    isOpen ? 'Удалить заказ?' : 'Удалить из истории?',
    isOpen ? 'Заказ будет удалён без сохранения в выручке.' : 'Заказ будет удалён навсегда и исключён из статистики.',
    { danger:true, okLabel:'Удалить' }
  );
  if(!ok) return;
  state.orders = state.orders.filter(x=>x.id!==o.id);
  await idbDelete('orders', o.id);
  showScreen(isOpen ? 'orders' : 'history');
}

/* ================= PICKER OVERLAY ================= */
function openPicker(){
  document.getElementById('pickerOverlay').hidden = false;
  const groupCats = state.categories.filter(c=>c.group===state.pickerGroup);
  if(!state.pickerCategoryId || !groupCats.find(c=>c.id===state.pickerCategoryId)){
    state.pickerCategoryId = groupCats.length ? groupCats[0].id : null;
  }
  renderPickerGroupTabs();
  renderPickerChips();
  renderPickerGrid();
  renderPickerTotal();
}
function closePicker(){
  document.getElementById('pickerOverlay').hidden = true;

}
function renderPickerGroupTabs(){
  document.querySelectorAll('#pickerGroupTabs .grouptab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.group===state.pickerGroup);
    btn.onclick = ()=>{
      state.pickerGroup = btn.dataset.group;
      const groupCats = state.categories.filter(c=>c.group===state.pickerGroup);
      state.pickerCategoryId = groupCats.length ? groupCats[0].id : null;
      renderPickerGroupTabs();
      renderPickerChips();
      renderPickerGrid();
    };

function renderPickerChips(){

function renderPickerGrid(){

function renderPickerTotal(){
  const o = getCurrentOrder();

/* ================= HISTORY ================= */
function dateKey(ts){ const d = new Date(ts); return d.toDateString(); }
function dateLabel(ts){
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  if(d.toDateString()===today.toDateString()) return 'Сегодня';
  if(d.toDateString()===yest.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long'});
}
function renderHistory(){
  const closed = state.orders.filter(o=>o.status==='closed').sort((a,b)=>b.closedAt-a.closedAt);
  const wrap = document.getElementById('historyList');
  if(closed.length===0){
    wrap.innerHTML = '<div class="empty"><span class="big">📜</span><div class="t">История пуста</div>Закрытые заказы появятся здесь</div>';
    return;
  }
  const groups = {};
  const order = [];
  closed.forEach(o=>{
    const key = dateKey(o.closedAt);
    if(!groups[key]){ groups[key]=[]; order.push(key); }
    groups[key].push(o);
  });
  wrap.innerHTML = order.map(key=>{
    const rows = groups[key];
    const label = dateLabel(rows[0].closedAt);
    const dayTotal = rows.reduce((s,o)=>s+orderTotal(o),0);
    return '<div class="date-group"><h3>'+label+' · '+money(dayTotal)+'</h3>' +
      rows.map(o=>{
        const total = orderTotal(o);
        const itemsHtml = o.lines.map(l=>'<div class="li"><span>'+esc(l.name)+' × '+l.qty+'</span><span class="num">'+money(l.price*l.qty)+'</span></div>').join('');
        return '<div class="hist-row" data-id="'+o.id+'">' +
          '<div class="top" data-act="toggle">' +
            '<div><div class="label">'+esc(o.label)+'</div><div class="time">'+timeStr(o.closedAt)+' · '+o.lines.reduce((s,l)=>s+l.qty,0)+' поз.</div></div>' +
            '<div class="total num">'+money(total)+'</div>' +
          '</div>' +
          '<div class="hist-items">'+itemsHtml+'</div>' +
          '<div class="hist-actions"><button class="btn btn-danger btn-sm" data-act="delete">🗑 Удалить</button></div>' +
        '</div>';
      }).join('') +
    '</div>';
  }).join('');

  wrap.querySelectorAll('.hist-row').forEach(row=>{
    const id = row.dataset.id;
    row.querySelector('[data-act="toggle"]').onclick = ()=>{
      const itemsEl = row.querySelector('.hist-items');
      const actionsEl = row.querySelector('.hist-actions');
      const isOpen = itemsEl.classList.toggle('open');
      actionsEl.style.display = isOpen ? 'flex' : 'none';
    };
    row.querySelector('.hist-items').nextElementSibling.style.display = 'none';
    row.querySelector('[data-act="delete"]').onclick = async (e)=>{
      e.stopPropagation();
      const ok = await askConfirm('Удалить заказ?', 'Заказ будет удалён навсегда и исключён из статистики.', {danger:true, okLabel:'Удалить'});
      if(!ok) return;
      state.orders = state.orders.filter(o=>o.id!==id);
      await idbDelete('orders', id);
      renderHistory();
    };
  });
}

/* ================= STATS ================= */
function renderStats(){
  const closed = state.orders.filter(o=>o.status==='closed');
  const today = new Date().toDateString();
  const todays = closed.filter(o=> new Date(o.closedAt).toDateString()===today);
  const todaySum = todays.reduce((s,o)=>s+orderTotal(o),0);
  const avg = todays.length ? todaySum/todays.length : 0;

  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const key = d.toDateString();
    const sum = closed.filter(o=>new Date(o.closedAt).toDateString()===key).reduce((s,o)=>s+orderTotal(o),0);
    days.push({ d, sum });
  }
  const maxSum = Math.max(1, ...days.map(x=>x.sum));

  const wrap = document.getElementById('statsBody');
  wrap.innerHTML =
    '<div class="stat-cards">' +
      '<div class="stat-card wide"><div class="lbl">Выручка сегодня</div><div class="v num">'+money(todaySum)+'</div></div>' +
      '<div class="stat-card"><div class="lbl">Заказов сегодня</div><div class="v num">'+todays.length+'</div></div>' +
      '<div class="stat-card"><div class="lbl">Средний чек</div><div class="v num">'+money(avg)+'</div></div>' +
    '</div>' +
    '<h3 style="font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;">Последние 7 дней</h3>' +
    '<div class="bars">' +
      days.map(x=>{
        const h = Math.max(4, Math.round(x.sum/maxSum*100));
        return '<div class="bar-col"><div class="amt num">'+(x.sum? Math.round(x.sum/1000)+'k':'')+'</div><div class="b" style="height:'+h+'%"></div><div class="day">'+x.d.toLocaleDateString('ru-RU',{weekday:'short'})+'</div></div>';
      }).join('') +
    '</div>';
}

        '<span>'+(isOpen?'▲':'▼')+'</span>' +

      '<div class="cat-block-body'+(isOpen?' open':'')+'">' +
        items.map(i=>{
          const thumb = i.photo ? '<img src="'+i.photo+'">' : cat.emoji;

          '</div>';
        }).join('') +
        '<div class="cat-actions">' +
          '<button class="btn btn-ghost btn-sm" data-act="add-item">＋ Блюдо</button>' +
          '<button class="btn btn-ghost btn-sm" data-act="edit-cat">✎ Категория</button>' +
          '<button class="btn btn-danger btn-sm" data-act="del-cat">🗑 Удалить</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');

  wrap.querySelectorAll('.cat-block').forEach(block=>{
    const catId = block.dataset.id;
    block.querySelector('[data-act="toggle"]').onclick = ()=>{
      state.menuOpenCategoryId = state.menuOpenCategoryId===catId ? null : catId;
      renderMenu();
    };
    const addBtn = block.querySelector('[data-act="add-item"]');
    if(addBtn) addBtn.onclick = ()=> openItemForm(null, catId);
    const editCatBtn = block.querySelector('[data-act="edit-cat"]');
    if(editCatBtn) editCatBtn.onclick = ()=> openCategoryForm(catId);
    const delCatBtn = block.querySelector('[data-act="del-cat"]');
    if(delCatBtn) delCatBtn.onclick = ()=> deleteCategory(catId);
    block.querySelectorAll('[data-act="edit-item"]').forEach(b=> b.onclick = ()=> openItemForm(b.dataset.id, catId));
    block.querySelectorAll('[data-act="del-item"]').forEach(b=> b.onclick = ()=> deleteItem(b.dataset.id));
  });
}

function openCategoryForm(catId){
  const cat = catId ? state.categories.find(c=>c.id===catId) : null;
  const groupVal = cat ? cat.group : 'kitchen';
  const card = openModal(
    '<h2>'+(cat?'Изменить категорию':'Новая категория')+'</h2>' +
    '<div class="field"><label>Название</label><input type="text" id="catName" value="'+(cat?esc(cat.name):'')+'" placeholder="Например: Десерты"></div>' +
    '<div class="field"><label>Эмодзи-иконка</label><input type="text" id="catEmoji" value="'+(cat?cat.emoji:'🍽️')+'" maxlength="4"></div>' +
    '<div class="field"><label>Раздел меню</label><select id="catGroup">' +
      '<option value="bar"'+(groupVal==='bar'?' selected':'')+'>🧃 Бар меню</option>' +
      '<option value="kitchen"'+(groupVal==='kitchen'?' selected':'')+'>🍽 Кухня меню</option>' +
    '</select></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" id="mCancel">Отмена</button><button class="btn btn-primary" id="mOk">Сохранить</button></div>'
  );
  card.querySelector('#mCancel').onclick = closeModal;
  card.querySelector('#mOk').onclick = async ()=>{
    const name = card.querySelector('#catName').value.trim();
    const emoji = card.querySelector('#catEmoji').value.trim() || '🍽️';
    const group = card.querySelector('#catGroup').value;
    if(!name) return;
    if(cat){ cat.name=name; cat.emoji=emoji; cat.group=group; await idbPut('categories',cat); }
    else{
      const newCat = { id:uid(), name, emoji, group };
      state.categories.push(newCat);
      await idbPut('categories', newCat);
    }
    closeModal(); renderMenu();
  };
}
async function deleteCategory(catId){
  const items = state.items.filter(i=>i.categoryId===catId);
  const ok = await askConfirm('Удалить категорию?', items.length ? ('Вместе с ней будет удалено блюд: '+items.length+'.') : 'Категория пуста.', {danger:true, okLabel:'Удалить'});
  if(!ok) return;
  state.categories = state.categories.filter(c=>c.id!==catId);
  await idbDelete('categories', catId);
  for(const it of items){ state.items = state.items.filter(i=>i.id!==it.id); await idbDelete('items', it.id); }
  renderMenu();
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function openItemForm(itemId, defaultCatId){
  const item = itemId ? state.items.find(i=>i.id===itemId) : null;
  let photoData = item ? item.photo : null;
  const catOptions = state.categories.map(c=>
    '<option value="'+c.id+'"'+((item?item.categoryId:defaultCatId)===c.id?' selected':'')+'>'+c.emoji+' '+esc(c.name)+'</option>'
  ).join('');
  const card = openModal(
    '<h2>'+(item?'Изменить блюдо':'Новое блюдо')+'</h2>' +
    '<div class="field"><label>Фото</label>' +
      '<div class="photo-row">' +
        '<div class="photo-preview" id="photoPreview">'+(photoData?'<img src="'+photoData+'">':'🍽️')+'</div>' +
        '<button class="btn btn-ghost btn-sm" id="btnTakePhoto" type="button">📷 Камера</button>' +
        '<button class="btn btn-ghost btn-sm" id="btnPickPhoto" type="button">🖼 Галерея</button>' +
      '</div>' +
      '<input type="file" accept="image/*" capture="environment" id="fileCam" style="display:none;">' +
      '<input type="file" accept="image/*" id="fileGal" style="display:none;">' +
    '</div>' +
    '<div class="field"><label>Название</label><input type="text" id="itName" value="'+(item?esc(item.name):'')+'" placeholder="Например: Маргарита"></div>' +
    '<div class="field"><label>Цена, ₸</label><input type="number" id="itPrice" value="'+(item?item.price:'')+'" placeholder="0" min="0"></div>' +
    '<div class="field"><label>Категория</label><select id="itCat">'+catOptions+'</select></div>' +
    '<div class="modal-actions">' +
      (item ? '<button class="btn btn-danger" id="mDelete">Удалить</button>' : '') +
      '<button class="btn btn-ghost" id="mCancel">Отмена</button>' +
      '<button class="btn btn-primary" id="mOk">Сохранить</button>' +
    '</div>'
  );
  const preview = card.querySelector('#photoPreview');
  async function handleFile(input){
    if(!input.files || !input.files[0]) return;
    photoData = await resizeImage(input.files[0], 480, 0.72);
    preview.innerHTML = '<img src="'+photoData+'">';
  }
  card.querySelector('#btnTakePhoto').onclick = ()=> card.querySelector('#fileCam').click();
  card.querySelector('#btnPickPhoto').onclick = ()=> card.querySelector('#fileGal').click();
  card.querySelector('#fileCam').onchange = e=> handleFile(e.target);
  card.querySelector('#fileGal').onchange = e=> handleFile(e.target);
  card.querySelector('#mCancel').onclick = closeModal;
  if(item) card.querySelector('#mDelete').onclick = ()=>{ closeModal(); deleteItem(item.id); };
  card.querySelector('#mOk').onclick = async ()=>{
    const name = card.querySelector('#itName').value.trim();
    const price = parseFloat(card.querySelector('#itPrice').value) || 0;
    const categoryId = card.querySelector('#itCat').value;
    if(!name || !categoryId) return;
    if(item){
      item.name=name; item.price=price; item.categoryId=categoryId; item.photo=photoData;
      await idbPut('items', item);
    } else {
      const newItem = { id:uid(), name, price, categoryId, photo:photoData };
      state.items.push(newItem);
      await idbPut('items', newItem);
    }
    closeModal(); renderMenu();
  };
}
async function deleteItem(itemId){
  const ok = await askConfirm('Удалить блюдо?', 'Оно исчезнет из меню.', {danger:true, okLabel:'Удалить'});
  if(!ok) return;
  state.items = state.items.filter(i=>i.id!==itemId);
  await idbDelete('items', itemId);
  renderMenu();
}

/* ================= SETTINGS ================= */
function openSettings(){
  const card = openModal(
    '<h2>Настройки</h2>' +
    '<div class="field"><label>Имя официанта</label><input type="text" id="setName" value="'+esc(state.meta.ownerName)+'"></div>' +
    '<div class="field"><label>Текущий PIN</label><input type="text" inputmode="numeric" maxlength="4" id="setPinOld" placeholder="••••"></div>' +
    '<div class="field"><label>Новый PIN (необязательно)</label><input type="text" inputmode="numeric" maxlength="4" id="setPinNew" placeholder="••••"></div>' +
    '<div class="modal-actions"><button class="btn btn-ghost" id="mCancel">Отмена</button><button class="btn btn-primary" id="mOk">Сохранить</button></div>'
  );
  card.querySelector('#mCancel').onclick = closeModal;
  card.querySelector('#mOk').onclick = async ()=>{
    const name = card.querySelector('#setName').value.trim();
    const oldPin = card.querySelector('#setPinOld').value.trim();
    const newPin = card.querySelector('#setPinNew').value.trim();
    if(newPin){
      if(oldPin !== state.meta.pin){ showToast('Неверный текущий PIN'); return; }
      if(!/^\d{4}$/.test(newPin)){ showToast('PIN должен быть из 4 цифр'); return; }
      state.meta.pin = newPin;
    }
    if(name) state.meta.ownerName = name;
    await idbPut('meta', state.meta);
    document.getElementById('lockWho').textContent = 'Официант: ' + state.meta.ownerName;
    showToast('Настройки сохранены');
    closeModal();
  };
}
